<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takım Görevleri</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2f6fed; --danger:#d9463b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { margin-right:auto; }
  header a { color:var(--accent); text-decoration:none; cursor:pointer; font-size:14px; }
  main { max-width:720px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:20px; }
  input[type=text], input[type=email], input[type=password] { padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:15px; width:100%; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .row input[type=text] { flex:1; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li .grow { flex:1; }
  .done { text-decoration:line-through; color:var(--muted); }
  .muted { color:var(--muted); font-size:13px; }
  .msg { color:var(--danger); font-size:14px; min-height:18px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header id="nav" class="hidden">
  <b>Takım Görevleri</b>
  <a onclick="show('projects')">Projelerim</a>
  <a id="navAll" class="hidden" onclick="show('all')">Tüm Projeler</a>
  <a onclick="show('profile')">Profil</a>
  <a onclick="logout()">Çıkış</a>
</header>

<main>
  <!-- GİRİŞ / KAYIT -->
  <section id="v-auth" class="card">
    <h2>Giriş yap / Kayıt ol</h2>
    <div class="row"><input id="email" type="email" placeholder="E-posta"></div>
    <div class="row"><input id="pass" type="password" placeholder="Şifre (en az 6 karakter)"></div>
    <div class="row"><button onclick="login()">Giriş</button><button class="ghost" onclick="signup()">Kayıt ol</button></div>
    <div id="authMsg" class="msg"></div>
  </section>

  <!-- PROJELERİM -->
  <section id="v-projects" class="card hidden">
    <h2>Projelerim</h2>
    <div class="row"><input id="newProject" type="text" placeholder="Yeni proje adı"><button onclick="addProject()">Ekle</button></div>
    <ul id="projectList"></ul>
  </section>

  <!-- PROJE DETAYI -->
  <section id="v-detail" class="card hidden">
    <h2 id="detailTitle"></h2>
    <div class="row"><input id="newTask" type="text" placeholder="Yeni görev"><button onclick="addTask()">Ekle</button></div>
    <ul id="taskList"></ul>
    <div class="row" style="margin-top:12px"><button class="ghost" onclick="clearDone()">Tamamlananları temizle</button><span id="detailMsg" class="muted"></span></div>
  </section>

  <!-- PROFİL -->
  <section id="v-profile" class="card hidden">
    <h2>Profil</h2>
    <p>E-posta: <b id="pEmail"></b></p>
    <div class="row"><input id="pName" type="text" placeholder="Görünen ad"><button onclick="saveProfile()">Kaydet</button></div>
    <div id="profileMsg" class="muted"></div>
    <p>Rol: <b id="pRole"></b></p>
    <p class="muted">Kullanıcı ID: <span id="pId"></span></p>
  </section>

  <!-- TÜM PROJELER (ADMIN) -->
  <section id="v-all" class="card hidden">
    <h2>Tüm Projeler (admin)</h2>
    <ul id="allList"></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Supabase paneli > Project Settings > API bölümündeki değerler
const SUPABASE_URL = "https://slegyfcscvvyrqtlukkz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Uv-V6LP3RttzoYN2QBRKgQ_CbC9gFPp";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let user = null, profile = null, currentProject = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function show(view) {
  ["auth","projects","detail","profile","all"].forEach(v => $("v-"+v).classList.toggle("hidden", v !== view));
  $("nav").classList.toggle("hidden", view === "auth");
  if (view === "projects") loadProjects();
  if (view === "profile") loadProfile();
  if (view === "all") loadAll();
}

async function signup() {
  const { error } = await sb.auth.signUp({ email: $("email").value, password: $("pass").value });
  $("authMsg").textContent = error ? error.message : "Kayıt tamam. Şimdi Giriş'e bas.";
}
async function login() {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("pass").value });
  if (error) { $("authMsg").textContent = error.message; return; }
  await afterLogin();
}
async function logout() { await sb.auth.signOut(); user = null; profile = null; show("auth"); }

async function afterLogin() {
  const { data } = await sb.auth.getUser();
  user = data.user;
  if (!user) { show("auth"); return; }
  const r = await sb.from("profiles").select("*").eq("id", user.id).single();
  profile = r.data;
  $("navAll").classList.toggle("hidden", profile?.role !== "admin");
  show("projects");
}

async function loadProjects() {
  const { data, error } = await sb.from("projects").select("*").eq("owner_id", user.id).order("created_at");
  $("projectList").innerHTML = error ? `<li class="msg">${esc(error.message)}</li>` :
    (data.length ? data.map(p => `<li><span class="grow">${esc(p.name)}</span>
      <button class="ghost" onclick="openProject('${p.id}')">Aç</button>
      <button class="danger" onclick="delProject('${p.id}')">Sil</button></li>`).join("")
      : `<li class="muted">Henüz proje yok.</li>`);
}
async function addProject() {
  const name = $("newProject").value.trim(); if (!name) return;
  await sb.from("projects").insert({ name, owner_id: user.id });
  $("newProject").value = ""; loadProjects();
}
async function delProject(id) { await sb.from("projects").delete().eq("id", id); loadProjects(); }

async function openProject(id) {
  currentProject = id;
  ["auth","projects","profile","all"].forEach(v => $("v-"+v).classList.add("hidden"));
  $("v-detail").classList.remove("hidden");
  $("detailMsg").textContent = "";
  loadTasks();
}
async function loadTasks() {
  const res = await sb.functions.invoke("get-project", { body: { project_id: currentProject } });
  const error = res.error, data = res.data?.tasks ?? [];
  $("detailTitle").textContent = res.data?.project?.name ?? "";
  $("taskList").innerHTML = error ? `<li class="msg">${esc(error.message)}</li>` :
    (data.length ? data.map(t => `<li>
      <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTask('${t.id}', this.checked)">
      <span class="grow ${t.done ? "done" : ""}">${esc(t.title)}</span>
      <button class="ghost" onclick="editTask('${t.id}')">Düzenle</button>
      <button class="danger" onclick="delTask('${t.id}')">Sil</button></li>`).join("")
      : `<li class="muted">Henüz görev yok.</li>`);
}
async function addTask() {
  const title = $("newTask").value.trim(); if (!title) return;
  await sb.from("tasks").insert({ title, project_id: currentProject });
  $("newTask").value = ""; loadTasks();
}
async function toggleTask(id, done) { await sb.from("tasks").update({ done }).eq("id", id); loadTasks(); }
async function editTask(id) {
  const title = prompt("Yeni görev adı:"); if (!title) return;
  await sb.from("tasks").update({ title }).eq("id", id); loadTasks();
}
async function delTask(id) { await sb.from("tasks").delete().eq("id", id); loadTasks(); }
async function clearDone() {
  if (!confirm("Bu projedeki tamamlanmış görevler silinsin mi?")) return;
  const { error } = await sb.from("tasks").delete().eq("done", true);
  $("detailMsg").textContent = error ? error.message : "Tamamlanan görevler temizlendi.";
  loadTasks();
}

async function loadProfile() {
  const r = await sb.from("profiles").select("*").eq("id", user.id).single();
  profile = r.data;
  $("pEmail").textContent = profile?.email ?? "";
  $("pName").value = profile?.full_name ?? "";
  $("profileMsg").textContent = "";
  $("pRole").textContent = profile?.role ?? "";
  $("pId").textContent = user.id;
}
async function saveProfile() {
  const { error } = await sb.from("profiles").update({ full_name: $("pName").value.trim() }).eq("id", user.id);
  $("profileMsg").textContent = error ? error.message : "Kaydedildi.";
}
async function loadAll() {
  const { data, error } = await sb.from("projects").select("*").order("created_at");
  $("allList").innerHTML = error ? `<li class="msg">${esc(error.message)}</li>` :
    data.map(p => `<li><span class="grow">${esc(p.name)}</span><span class="muted">${esc(p.owner_id)}</span></li>`).join("");
}

// Sayfa açılınca oturum varsa direkt gir
sb.auth.getSession().then(({ data }) => data.session ? afterLogin() : show("auth"));
</script>
</body>
</html>
